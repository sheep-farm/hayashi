id: coint_book
title: Bivariate cointegrated system from the Hayashi book
estimator_family: vecm
status: pass
dimension: numerical
dataset:
  name: simulated_cointegrated
  source: DGP from book_pt_BR/codes/29_coint.hay
  size: 300 observations
references:
- R
- Python
reference_evidence:
  R:
    coefficients:
      class: convention-matched
      rationale: Manual Johansen ML aligns rank 1, lag order, intercept residualisation and Cholesky-based beta scaling with reciprocal alpha scaling.
    standard_errors:
      class: behavioural-proxy
      rationale: Engle-Granger/OLS beta proxies and conditional OLS alpha SEs are retained diagnostics, not validation of Hayashi bootstrap uncertainty.
  Python:
    coefficients:
      class: convention-matched
      rationale: Manual Johansen ML aligns rank 1, lag order, intercept residualisation and Cholesky-based beta scaling with reciprocal alpha scaling.
    standard_errors:
      class: behavioural-proxy
      rationale: Engle-Granger/OLS beta proxies and conditional OLS alpha SEs are retained diagnostics, not validation of Hayashi bootstrap uncertainty.
reference_scripts:
  R: cases/coint_book/reference/run.R
  Python: cases/coint_book/reference/run.py
hayashi_script: cases/coint_book/hayashi/run.hay
output_format: txt
comparison:
  quantities:
  - coefficients
  - standard_errors
  tolerances:
    coefficients: 1e-2
    standard_errors: 5e-1
notes: VECM(1) on a simulated cointegrated system where y = 2*x + e2 and x = cumsum(e1).
  Johansen coefficients use aligned rank and normalisation conventions. Legacy beta
  Engle-Granger/OLS and conditional alpha OLS SE comparisons are retained proxy
  diagnostics at tolerance 5e-1, not validation of Hayashi bootstrap uncertainty.
