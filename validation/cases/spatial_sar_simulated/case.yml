id: spatial_sar_simulated
title: Spatial autoregressive (SAR) model on simulated grid data
estimator_family: spatial_sar
status: pass
dimension: numerical

dataset:
  name: simulated
  source: generated by data/gen.py
  licence: n/a

references:
  - R
  - Python

comparison:
  quantities:
    - coefficients
    - standard_errors
  tolerances:
    coefficients: 5e-3
    standard_errors: 1.0

output_format: csv

hayashi_script: cases/spatial_sar_simulated/hayashi/run.hay
reference_scripts:
  R: cases/spatial_sar_simulated/reference/run.R
  Python: cases/spatial_sar_simulated/reference/run.py

notes: Data generated on a 7x7 grid with rook contiguity W, rho=0.3, beta=0.5. Reference implements the same concentrated MLE independently.

result:
  summary: "SAR rho and coefficients match independent concentrated MLE."
  known_differences:
    - The reference does not compute a standard error for rho; it is reported as NaN.
  issues_opened: []
