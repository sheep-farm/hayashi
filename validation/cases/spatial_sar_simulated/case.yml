id: spatial_sar_simulated
title: Spatial autoregressive (SAR) model on simulated grid data
estimator_family: spatial_sar
status: active
dimension: numerical

dataset:
  name: simulated
  source: generated by data/gen.py
  licence: n/a

references:
  - Python

comparison:
  quantities:
    - coefficients
  tolerances:
    coefficients: 5e-3

output_format: txt

hayashi_script: cases/spatial_sar_simulated/hayashi/run.hay
reference_scripts:
  Python: cases/spatial_sar_simulated/reference/run.py

notes: >-
  Data generated on a 7x7 grid with rook contiguity W, rho=0.3, beta=0.5.
  Reference implements the same concentrated MLE independently to verify
  consistency; an independent R/spdep reference is desired in the future.

result:
  summary: "SAR rho and coefficients match independent concentrated MLE."
  known_differences:
    - Standard errors for rho not computed by the reference.
  issues_opened: []
