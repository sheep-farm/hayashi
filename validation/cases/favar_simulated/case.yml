id: favar_simulated
title: Factor-augmented VAR on simulated data
estimator_family: favar
status: active
dimension: numerical

dataset:
  name: simulated
  source: generated by data/gen.py
  licence: n/a

references:
  - Python

comparison:
  quantities:
    - coefficients
  tolerances:
    coefficients: 0.5

output_format: csv

hayashi_script: cases/favar_simulated/hayashi/run.hay
reference_scripts:
  Python: cases/favar_simulated/reference/run.py

notes: Simulated three observable series driven by one common factor plus the observed y1. Python reference extracts the first PCA factor and estimates a VAR(1) by OLS, matching the FAVAR two-step approach.

result:
  summary: "Hayashi FAVAR two-step compared against a Python PCA + VAR reference."
  known_differences:
    - Factor sign and PCA scaling may differ; the sign is aligned to the first reference series.
  issues_opened: []
