id: synthdid_simulated
title: Synthetic DiD point-estimate proxy on simulated panel data
estimator_family: synthdid
status: pass
dimension: numerical

dataset:
  name: simulated
  source: generated by data/gen.py
  licence: n/a

references:
  - R
  - Python

comparison:
  quantities:
    - coefficients
  tolerances:
    coefficients: 5e-2

reference_evidence:
  R:
    coefficients:
      class: behavioural-proxy
      rationale: Related pre-treatment-weighted post-treatment gap; the general synthetic DiD estimator and inference contract are not matched.
  Python:
    coefficients:
      class: behavioural-proxy
      rationale: Related pre-treatment-weighted post-treatment gap; the general synthetic DiD estimator and inference contract are not matched.

output_format: csv

hayashi_script: cases/synthdid_simulated/hayashi/run.hay
reference_scripts:
  R: cases/synthdid_simulated/reference/run.R
  Python: cases/synthdid_simulated/reference/run.py

notes: Simulated panel with 20 units, 10 periods, treatment begins at period 6 for unit 0 with ATT=2.0. Only the point estimate is compared with a synthetic-control-style pre-treatment weighting reference. Uncertainty and general synthetic DiD validity are outside this proxy comparison.

result:
  summary: "The point estimate matches the simple synthetic-control-style reference; this proxy does not qualify synthetic DiD inference."
  known_differences:
    - The ATT is a scalar treatment-effect estimate; standard error is set to NaN.
  issues_opened: []
