id: synthdid_simulated
title: Synthetic Difference-in-Differences on simulated panel data
estimator_family: synthdid
status: active
dimension: numerical

dataset:
  name: simulated
  source: generated by data/gen.py
  licence: n/a

references:
  - R
  - Python

comparison:
  quantities:
    - coefficients
    - standard_errors
  tolerances:
    coefficients: 5e-2
    standard_errors: 1.0

output_format: csv

hayashi_script: cases/synthdid_simulated/hayashi/run.hay
reference_scripts:
  R: cases/synthdid_simulated/reference/run.R
  Python: cases/synthdid_simulated/reference/run.py

notes: Simulated panel with 20 units, 10 periods, treatment begins at period 6 for unit 0 with ATT=2.0. Reference uses a simple synthetic-control-style pre-treatment weighting and computes the post-treatment mean gap. The ATT has no standard error.

result:
  summary: "Synthetic DiD ATT matches the simple synthetic-control reference."
  known_differences:
    - The ATT is a scalar treatment-effect estimate; standard error is set to NaN.
  issues_opened: []
