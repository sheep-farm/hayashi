id: clogit_simulated
title: Conditional logit on simulated panel data
estimator_family: clogit
status: active
dimension: numerical

dataset:
  name: simulated
  source: generated by data/gen.py
  licence: n/a

references:
  - R

comparison:
  quantities:
    - coefficients
    - standard_errors
  tolerances:
    coefficients: 1e-4
    standard_errors: 1e-4

output_format: txt

hayashi_script: cases/clogit_simulated/hayashi/run.hay
reference_scripts:
  R: cases/clogit_simulated/reference/run.R

notes: Simulated matched groups with group fixed effects and a single endogenous regressor. R reference is survival::clogit; groups without within-group variation are dropped at generation time.

result:
  summary: "Hayashi conditional logit matches R survival::clogit."
  known_differences: []
  issues_opened: []
