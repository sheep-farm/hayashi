id: gmm_overidentified_simulated
title: Overidentified two-step linear GMM on heteroskedastic simulated data
estimator_family: gmm
status: pass
dimension: numerical

dataset:
  name: simulated overidentified IV-GMM DGP
  source: generated by data/gen.py with seed 20260815
  licence: n/a

references:
  - R
  - Python

comparison:
  quantities:
    - coef_const
    - coef_x
    - coef_endog
    - se_const
    - se_x
    - se_endog
    - j_stat
    - df_overid
    - n_obs
  tolerances:
    coef_const: 1e-10
    coef_x: 1e-10
    coef_endog: 1e-10
    se_const: 1e-5
    se_x: 1e-5
    se_endog: 1e-5
    j_stat: 1e-10
    df_overid: 0
    n_obs: 0

output_format: json
hayashi_script: cases/gmm_overidentified_simulated/hayashi/run.hay
reference_scripts:
  R: cases/gmm_overidentified_simulated/reference/run.R
  Python: cases/gmm_overidentified_simulated/reference/run.py

notes: >-
  The DGP has one endogenous regressor and two excluded, valid instruments, so
  L-K=1. R gmm and Python linearmodels use two-step heteroskedastic GMM. The
  maximum standard-error difference is 2.569e-6; 1e-5 accepts the asymptotically
  equivalent finite-sample covariance forms. Coefficients and the Hansen J
  statistic agree to numerical precision.

result:
  summary: >-
    Hayashi matches independent R and Python references for coefficients,
    Hansen J, overidentification df, and sample size; robust SEs are accepted
    within the declared asymptotically equivalent covariance tolerance.
  known_differences:
    - >-
      Greeners uses its first-step residual moment covariance in the efficient
      inverse-form variance, whereas R and Python report a final-residual
      sandwich covariance. The maximum observed SE difference is 2.569e-6.
  issues_opened:
    - https://github.com/sheep-farm/hayashi/issues/144
