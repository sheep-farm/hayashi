id: midas_simulated
title: MIDAS regression on simulated mixed-frequency data
estimator_family: midas
status: active
dimension: numerical

dataset:
  name: simulated
  source: generated by data/gen.py
  licence: n/a

references:
  - Python

comparison:
  quantities:
    - coefficients
  tolerances:
    coefficients: 5e-2

output_format: csv

hayashi_script: cases/midas_simulated/hayashi/run.hay
reference_scripts:
  Python: cases/midas_simulated/reference/run.py

notes: Simulated low-frequency y (T=100) and high-frequency x (T*3). y = 1.0 + 2.0 * x_midas + noise. Compare alpha, beta and R-squared against Python MIDAS grid+minimize reference.

result:
  summary: "Hayashi MIDAS with two DataFrames matches Python reference."
  known_differences:
    - Greeners uses grid+Newton; reference uses Powell. Coefficients may differ slightly.
  issues_opened: []
