id: stl_airpassengers
title: Robust STL full components on log AirPassengers
estimator_family: stl
status: pass
dimension: numerical

dataset:
  name: AirPassengers
  source: R datasets::AirPassengers, generated locally by data/gen.R
  licence: Distributed with R datasets; no separate dataset licence asserted

references:
  - Python

comparison:
  quantities:
    - coefficients
    - coefficients.nobs
    - coefficients.reconstruction_max
  tolerances:
    coefficients: 1.0e-8
    coefficients.nobs: 0
    coefficients.reconstruction_max: 1.0e-12

hayashi_script: cases/stl_airpassengers/hayashi/run.hay
reference_scripts:
  Python: cases/stl_airpassengers/reference/run.py

notes: >-
  Provisional fork repair matches all 578 declared quantities, including all 144
  log AirPassengers trend/seasonal/remainder values against statsmodels 0.14.6.
  Period 12, windows 7/23/23, degrees/jumps 1, inner 2, outer 1 are unchanged.
  Python-only median-weight contract; robust R disagrees and is not a reference.
  Component atol 1e-8 was selected after exploration; reconstruction 1e-12 alone
  is not STL qualification. No tolerance widening. Upstream contract acceptance
  and STL contribution-terms clarification remain open; see case README.

result:
  summary: Provisional immutable fork matches the declared Python full-vector contract.
  known_differences:
    - R robust STL disagrees with Python and is not a declared reference.
    - This fixed-case agreement does not establish general STL accuracy or upstream acceptance.
  issues_opened: [160]
