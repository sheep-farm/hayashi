notes: >-
  Structural-break Johansen test. Python statsmodels.tsa.vecm coint_johansen
  does not support exogenous break dummies. R urca::ca.jo accepts the dummy but
  uses conventional rather than Hayashi's break-adjusted rank critical values.
  Neither provides a fully comparable reference for the declared rank-and-trace
  contract.
