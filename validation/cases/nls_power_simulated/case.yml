id: nls_power_simulated
title: Nonlinear least squares power model on simulated data
estimator_family: nls
status: active
dimension: numerical

dataset:
  name: simulated
  source: generated by data/gen.py
  licence: n/a

references:
  - R
  - Python

comparison:
  quantities:
    - coefficients
    - standard_errors
  tolerances:
    coefficients: 1e-4
    standard_errors: 1e-2

output_format: txt

hayashi_script: cases/nls_power_simulated/hayashi/run.hay
reference_scripts:
  R: cases/nls_power_simulated/reference/run.R
  Python: cases/nls_power_simulated/reference/run.py

notes: Simulated data from y = a * x^b + N(0, 0.3). Coefficients and standard
  errors compared against R `nls` and Python `scipy.optimize.curve_fit`.

result:
  summary: "Hayashi NLS power matches R and Python references."
  known_differences: []
  issues_opened: []
