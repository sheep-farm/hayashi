id: copula_simulated
title: Gaussian copula on simulated bivariate normal data
estimator_family: copula
status: active
dimension: numerical

dataset:
  name: simulated
  source: generated by data/gen.py
  licence: n/a

references:
  - R
  - Python

comparison:
  quantities:
    - corr_yx
    - kendall_yx
    - spearman_yx
  tolerances:
    corr_yx: 1e-12
    kendall_yx: 1e-12
    spearman_yx: 1e-12

output_format: keyvalue

hayashi_script: cases/copula_simulated/hayashi/run.hay
reference_scripts:
  R: cases/copula_simulated/reference/run.R
  Python: cases/copula_simulated/reference/run.py

notes: >-
  Simulated bivariate normal with Pearson correlation 0.6.
  Hayashi `copula(..., type="gaussian")` returns the empirical
  correlation matrix, Kendall's tau, and Spearman's rho. The Gaussian
  copula parameter for a bivariate normal equals the Pearson correlation.

result:
  summary: "Gaussian copula dependence measures match R and Python references."
  known_differences: []
  issues_opened: []
