id: fmols_simulated
title: FMOLS on cointegrated simulated data
estimator_family: fmols
status: not-supported
dimension: numerical
dataset:
  name: simulated
  source: generated by data/gen.py
  licence: n/a
references:
- R
comparison:
  quantities:
  - coefficients
  - standard_errors
  tolerances:
    coefficients: 5e-2
    standard_errors: 5e-1
output_format: csv
hayashi_script: cases/fmols_simulated/hayashi/run.hay
reference_scripts:
  R: cases/fmols_simulated/reference/run.R
notes: >-
  FMOLS remains unqualified: the engine omits the one-sided bias correction
  and uses unconditional long-run variance. Native R/Python diagnostics exist;
  finite-sample conventions and numerical acceptance bounds are not adopted.
  See Greeners issue 23, Hayashi issue 152 and the case README.
result:
  summary: ''
  known_differences: []
  issues_opened: []
experimental: true
