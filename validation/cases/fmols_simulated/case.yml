reference_scripts:
  R: cases/fmols_simulated/reference/run.R
  Python: cases/fmols_simulated/reference/run.py
notes: 'Four fixed FMOLS fixtures: IID, endogeneity, serial correlation and a fresh-seed combined holdout.
  Each uses initial N=300, final n=299, Bartlett B=5, no HAC centring/df adjustment and n bias multiplier.
  Native arch 8.0.0 and convention-adjusted cointReg 0.2.0 compare every fixture coefficient and SE at unchanged
  absolute tolerance 1e-10, with exact counts/bands. Native R coefficients remain in diagnostics. This numerical
  pass does not qualify nominal 95% interval calibration: endogenous AR coverage was 90.0%/91.8% at N=300/N=1,000.
  Normal probabilities are checked by engine tests, not this case.'
result:
  summary: All four declared FMOLS fixture calculations agree independently with R and Python.
  known_differences:
  - R uses original-N bias multiplier and Student-t probabilities; the declared coefficient adapter selects
    n=N-1.
  - Endogenous AR simulation intervals undercover nominal 95%; numerical pass is not coverage qualification.
  issues_opened:
  - 152
experimental: true
