id: varma_simulated
title: VARMA(1,1) on simulated bivariate series
estimator_family: varma
status: active
dimension: numerical

dataset:
  name: simulated
  source: generated by data/gen.py
  licence: n/a

references:
  - Python

comparison:
  quantities:
    - coefficients
  tolerances:
    coefficients: 0.05

output_format: csv

hayashi_script: cases/varma_simulated/hayashi/run.hay
reference_scripts:
  Python: cases/varma_simulated/reference/run.py

notes: Bivariate VARMA(1,1) with known AR and MA matrices. Hayashi uses the Hannan-Rissanen algorithm; the Python reference uses statsmodels VARMAX with no trend. Coefficients are compared (standard errors are not computed by the current Hayashi VARMA implementation).

result:
  summary: "Hayashi VARMA(1,1) coefficients match statsmodels VARMAX in the same column-major vectorisation."
  known_differences: []
  issues_opened: []
