id: qreg_simulated
title: Quantile regression at tau=0.75 on simulated heteroskedastic data
estimator_family: qreg
status: active
dimension: numerical

dataset:
  name: simulated
  source: generated by data/gen.py
  licence: n/a

references:
  - Python

comparison:
  quantities:
    - const
    - x
  tolerances:
    const: 1e-6
    x: 1e-6

output_format: keyvalue

hayashi_script: cases/qreg_simulated/hayashi/run.hay
reference_scripts:
  Python: cases/qreg_simulated/reference/run.py

notes: >-
  Simulated heteroskedastic data y = 1 + 2x + (1 + 0.5x) * (Exponential(1)-1).
  Quantile regression at tau=0.75 compared against statsmodels. boot=0 to avoid
  bootstrap overhead.

result:
  summary: "Hayashi quantile regression matches statsmodels."
  known_differences: []
  issues_opened: []
