id: rf_simulated
title: Random forest regression on simulated data
estimator_family: rf
status: active
dimension: numerical

dataset:
  name: simulated
  source: generated by data/gen.py
  licence: n/a

references:
  - R
  - Python

comparison:
  quantities:
    - coefficients
    - standard_errors
  tolerances:
    coefficients: 5e-3
    standard_errors: 1.0

output_format: csv

hayashi_script: cases/rf_simulated/hayashi/run.hay
reference_scripts:
  R: cases/rf_simulated/reference/run.R
  Python: cases/rf_simulated/reference/run.py

notes: Simulated data y = 3*x1 + N(0, 0.1). In-sample R² compared against scikit-learn. Standard errors are not defined for an out-of-bag R² summary.

result:
  summary: "In-sample R² matches scikit-learn."
  known_differences:
    - Random forest R² is a scalar goodness-of-fit measure; standard error is set to NaN.
  issues_opened: []
