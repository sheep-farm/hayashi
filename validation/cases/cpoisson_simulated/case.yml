id: cpoisson_simulated
title: Conditional Poisson on simulated panel data
estimator_family: cpoisson
status: active
dimension: numerical

dataset:
  name: simulated
  source: generated by data/gen.py
  licence: n/a

references:
  - R
  - Python

comparison:
  quantities:
    - coefficients
    - standard_errors
  tolerances:
    coefficients: 1e-4
    standard_errors: 1e-4

output_format: txt

hayashi_script: cases/cpoisson_simulated/hayashi/run.hay
reference_scripts:
  R: cases/cpoisson_simulated/reference/run.R
  Python: cases/cpoisson_simulated/reference/run.py

notes: Simulated panel counts with group fixed effects; the reference implements the exact conditional Poisson likelihood (multinomial fixed-total) using analytic gradient and Hessian.

result:
  summary: "Hayashi conditional Poisson matches the exact conditional MLE."
  known_differences: []
  issues_opened: []
