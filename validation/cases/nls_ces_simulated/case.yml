id: nls_ces_simulated
title: Nonlinear least squares CES model on simulated data
estimator_family: nls
status: active
dimension: numerical

dataset:
  name: simulated
  source: generated by data/gen.py
  licence: n/a

references:
  - R
  - Python

comparison:
  quantities:
    - coefficients
    - standard_errors
  tolerances:
    coefficients: 1e-6
    standard_errors: 1e-6

output_format: csv

hayashi_script: cases/nls_ces_simulated/hayashi/run.hay
reference_scripts:
  R: cases/nls_ces_simulated/reference/run.R
  Python: cases/nls_ces_simulated/reference/run.py

notes: Simulated data from y = a * (b1*x1^rho + (1-b1)*x2^rho)^(1/rho) + N(0, 0.1).
  The CES function is now identified by the share restriction b2 = 1 - b1.

result:
  summary: "Hayashi NLS CES matches R and Python references."
  known_differences:
    - R nls uses the port algorithm with bounds and scipy curve_fit clips the share; both NLS solutions agree at the 1e-6 level.
  issues_opened: []
