id: bart_simulated
title: Bayesian Additive Regression Trees on simulated data
estimator_family: bart
status: pass
dimension: numerical

dataset:
  name: simulated
  source: generated by data/gen.py
  licence: n/a

references:
  - R
  - Python

reference_evidence:
  R:
    coefficients.mse:
      class: behavioural-proxy
      rationale: gbm boosting MSE is a predictive diagnostic, not a BART posterior comparison.
    coefficients.r_squared:
      class: behavioural-proxy
      rationale: gbm boosting R-squared does not establish the BART fitting or inference contract.
  Python:
    coefficients.mse:
      class: behavioural-proxy
      rationale: GradientBoostingRegressor MSE is a predictive diagnostic, not a BART posterior comparison.
    coefficients.r_squared:
      class: behavioural-proxy
      rationale: GradientBoostingRegressor R-squared does not establish the BART fitting or inference contract.

comparison:
  quantities:
    - coefficients.mse
    - coefficients.r_squared
  tolerances:
    coefficients.mse: 0.5
    coefficients.r_squared: 0.05

output_format: csv

hayashi_script: cases/bart_simulated/hayashi/run.hay
reference_scripts:
  R: cases/bart_simulated/reference/run.R
  Python: cases/bart_simulated/reference/run.py

notes: Simulated data y = 3*x1 + N(0, 0.1), x2 irrelevant. BART with 20 trees, depth 3, 500 post-burn draws and 200 burn-in. R gbm and Python GradientBoostingRegressor provide predictive diagnostics, not BART posterior or inference validation.

result:
  summary: ""
  known_differences:
    - R reference uses the gbm package, whose stochastic boosting differs slightly from scikit-learn's GradientBoostingRegressor.
  issues_opened: []
