id: panel_tobit_simulated
title: Panel Tobit with random effects on simulated censored panel data
estimator_family: panel
status: active
dimension: numerical

dataset:
  name: simulated
  source: generated by data/gen.py
  licence: n/a

references:
  - R
  - Python

comparison:
  quantities:
    - coefficients
    - standard_errors
  tolerances:
    coefficients: 5e-3
    standard_errors: 5e-2

output_format: csv

hayashi_script: cases/panel_tobit_simulated/hayashi/run.hay
reference_scripts:
  R: cases/panel_tobit_simulated/reference/run.R
  Python: cases/panel_tobit_simulated/reference/run.py

notes: Simulated panel with N=50, T=4, random effects, left-censored at 0. Coefficients and standard errors compared against pooled Tobit (censReg and MLE).

result:
  summary: "Hayashi panel Tobit (RE) matches pooled Tobit references at moderate tolerance."
  known_differences:
    - Pooled Tobit ignores random effects; standard errors are therefore slightly different from panel RE.
  issues_opened: []
