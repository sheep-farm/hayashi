id: nls_cobb_douglas_simulated
title: Nonlinear least squares Cobb-Douglas model on simulated data
estimator_family: nls
status: active
dimension: numerical

dataset:
  name: simulated
  source: generated by data/gen.py
  licence: n/a

references:
  - R
  - Python

comparison:
  quantities:
    - coefficients
    - standard_errors
  tolerances:
    coefficients: 1e-4
    standard_errors: 1e-2

output_format: txt

hayashi_script: cases/nls_cobb_douglas_simulated/hayashi/run.hay
reference_scripts:
  R: cases/nls_cobb_douglas_simulated/reference/run.R
  Python: cases/nls_cobb_douglas_simulated/reference/run.py

notes: Simulated data from y = a * x1^b1 * x2^b2 + N(0, 0.3). Coefficients
  and standard errors compared against R `nls` and Python `curve_fit`.

result:
  summary: "Hayashi NLS Cobb-Douglas matches R and Python references."
  known_differences: []
  issues_opened: []
