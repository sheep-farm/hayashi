id: gmm_clust_simulated
title: Gaussian mixture clustering on simulated blobs
estimator_family: gmm_clust
status: active
dimension: numerical

dataset:
  name: simulated
  source: generated by data/gen.py
  licence: n/a

references:
  - Python

comparison:
  quantities:
    - coefficients.mean_x_min
    - coefficients.mean_x_max
    - coefficients.mean_y_min
    - coefficients.mean_y_max
  tolerances:
    coefficients.mean_x_min: 0.3
    coefficients.mean_x_max: 0.3
    coefficients.mean_y_min: 0.3
    coefficients.mean_y_max: 0.3

output_format: csv

hayashi_script: cases/gmm_clust_simulated/hayashi/run.hay
reference_scripts:
  Python: cases/gmm_clust_simulated/reference/run.py

notes: Two Gaussian clusters. Compare sorted component means.

result:
  summary: ""
  known_differences: []
  issues_opened: []
