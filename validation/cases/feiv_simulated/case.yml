  Python: cases/feiv_simulated/reference/run.py

notes: Panel with N=200 entities and T=5 periods; x is endogenous and instrumented by z. Independent R and Python within-2SLS references use the Greeners residual degrees-of-freedom convention n - k - (G - 1).

result:
  summary: "Hayashi FE-2SLS matches independent R and Python within-2SLS references at full output precision."
  known_differences: []
  issues_opened:
