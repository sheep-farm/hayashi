id: feiv_simulated
title: Fixed-effects IV on simulated panel data
estimator_family: feiv
status: active
dimension: numerical

dataset:
  name: simulated
  source: generated by data/gen.py
  licence: n/a

references:
  - Python

comparison:
  quantities:
    - coefficients
    - standard_errors
  tolerances:
    coefficients: 1e-4
    standard_errors: 1e-4

output_format: txt

hayashi_script: cases/feiv_simulated/hayashi/run.hay
reference_scripts:
  Python: cases/feiv_simulated/reference/run.py

notes: Panel with N=200 entities and T=5 periods; x is endogenous and instrumented by z. Within-2SLS reference computes the same FE-IV coefficients and standard errors that account for the N fixed effects in the residual degrees of freedom.

result:
  summary: "Hayashi FE-2SLS matches the within-2SLS reference."
  known_differences: []
  issues_opened: []
