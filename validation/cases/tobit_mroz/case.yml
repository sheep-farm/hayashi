id: tobit_mroz
title: Tobit hours-worked model on Wooldridge mroz
estimator_family: tobit
status: pass
dimension: numerical
dataset:
  name: wooldridge::mroz
  source: R package wooldridge / Python wooldridge package
  licence: public teaching dataset
references:
- R
- Python
comparison:
  quantities:
  - coefficients
  - standard_errors
  tolerances:
    coefficients: 1e-3
    standard_errors: 0.5
output_format: txt
hayashi_script: cases/tobit_mroz/hayashi/run.hay
reference_scripts:
  R: cases/tobit_mroz/reference/run.R
  Python: cases/tobit_mroz/reference/run.py
notes: Tobit regression of hours worked with left censoring at zero. Hayashi matches
  AER::tobit at displayed precision; the new Python reference is a manual MLE refined
  with Nelder-Mead and uses a numerical Hessian for standard errors.
result:
  summary: Matches AER::tobit within strict displayed-output tolerance.
  known_differences:
  - Python standard errors use a numerical Hessian and may differ from AER by up to ~0.5
  issues_opened: []
