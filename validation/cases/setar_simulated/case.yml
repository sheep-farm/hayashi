id: setar_simulated
title: Self-exciting threshold autoregression on simulated data
estimator_family: setar
status: active
dimension: numerical

dataset:
  name: simulated
  source: generated by data/gen.py
  licence: n/a

references:
  - R
  - Python

comparison:
  quantities:
    - coefficients
    - standard_errors
  tolerances:
    coefficients: 5e-2
    standard_errors: 5e-2

output_format: csv

hayashi_script: cases/setar_simulated/hayashi/run.hay
reference_scripts:
  R: cases/setar_simulated/reference/run.R
  Python: cases/setar_simulated/reference/run.py

notes: Simulated SETAR(1,1,1) with two regimes split by y_{t-1}. Hayashi grid search may differ slightly from R tsDyn; tolerances are relaxed accordingly.

result:
  summary: "Hayashi SETAR matches independent grid-search and R tsDyn references."
  known_differences: []
  issues_opened: []
