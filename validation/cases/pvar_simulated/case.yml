id: pvar_simulated
title: Panel VAR on simulated dynamic panel data
estimator_family: pvar
status: active
dimension: numerical

dataset:
  name: simulated
  source: generated by data/gen.py
  licence: n/a

references:
  - R
  - Python

comparison:
  quantities:
    - coefficients
    - standard_errors
  tolerances:
    coefficients: 1e-1
    standard_errors: 1e-1

output_format: csv

hayashi_script: cases/pvar_simulated/hayashi/run.hay
reference_scripts:
  R: cases/pvar_simulated/reference/run.R
  Python: cases/pvar_simulated/reference/run.py

notes: Simulated bivariate panel VAR with N=50 and T=100. Hayashi GMM and within-OLS references agree within moderate tolerance due to the Nickell bias in within estimation.

result:
  summary: "Hayashi panel VAR matches within-OLS references."
  known_differences:
    - Within-OLS has the well-known Nickell bias for short T, so relaxed tolerances are used.
  issues_opened: []
