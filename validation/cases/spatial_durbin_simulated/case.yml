id: spatial_durbin_simulated
title: Spatial Durbin model on simulated grid data
estimator_family: spatial_durbin
status: pass
dimension: numerical

dataset:
  name: simulated
  source: generated by data/gen.py
  licence: n/a

references:
  - R
  - Python

comparison:
  quantities:
    - coefficients
    - standard_errors
  tolerances:
    coefficients: 2e-1
    standard_errors: 1.0

output_format: csv

hayashi_script: cases/spatial_durbin_simulated/hayashi/run.hay
reference_scripts:
  R: cases/spatial_durbin_simulated/reference/run.R
  Python: cases/spatial_durbin_simulated/reference/run.py

notes: Data generated on a 7x7 grid with rook contiguity W, rho=-0.95, beta=0.5. The Durbin model is highly collinear; only the spatial autoregressive parameter is compared.

result:
  summary: "Spatial Durbin rho matches independent concentrated MLE."
  known_differences:
    - Only the spatial autoregressive parameter is reported; its standard error is set to NaN.
  issues_opened: []
