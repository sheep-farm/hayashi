id: spatial_durbin_simulated
title: Spatial Durbin model on simulated cross-sectional grid data
estimator_family: spatial_durbin
status: active
dimension: numerical

dataset:
  name: simulated
  source: generated by data/gen.py
  licence: n/a

references:
  - Python

comparison:
  quantities:
    - rho
  tolerances:
    rho: 5e-2

output_format: keyvalue

hayashi_script: cases/spatial_durbin_simulated/hayashi/run.hay
reference_scripts:
  Python: cases/spatial_durbin_simulated/reference/run.py

notes: >-
  Data generated on a 7x7 grid with rook contiguity W, rho=0.3, beta=0.5,
  theta=0.2. Only rho is compared because the intercept and spatially lagged
  intercept are collinear in the cross-sectional specification.

result:
  summary: "Spatial Durbin rho matches independent concentrated SSE reference."
  known_differences: []
  issues_opened: []
