id: qvar_simulated
title: Quantile VAR on simulated data
estimator_family: qvar
status: pass
dimension: numerical

dataset:
  name: simulated
  source: generated by data/gen.py
  licence: n/a

references:
  - R
  - Python

comparison:
  quantities:
    - coefficients
  tolerances:
    coefficients: 0.10

output_format: csv

hayashi_script: cases/qvar_simulated/hayashi/run.hay
reference_scripts:
  R: cases/qvar_simulated/reference/run.R
  Python: cases/qvar_simulated/reference/run.py

notes: |
  Simulated bivariate VAR(1) process. Both R (quantreg::rq) and Python
  (statsmodels QuantReg) are run separately for each equation at the median
  (tau=0.5). Quantile-regression standard errors are algorithm- and
  implementation-specific, so only coefficients are compared and std_err is
  set to NaN.

result:
  summary: "Hayashi qvar coefficients compared against R quantreg and Python statsmodels QuantReg."
  known_differences:
    - Quantile regression solvers may differ slightly, especially on small samples.
  issues_opened: []
