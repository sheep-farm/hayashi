id: hclust_simulated
title: Hierarchical clustering on simulated blobs
estimator_family: hclust
status: active
dimension: numerical

dataset:
  name: simulated
  source: generated by data/gen.py
  licence: n/a

references:
  - Python

comparison:
  quantities:
    - coefficients.n_clusters
    - coefficients.min_cluster_size
    - coefficients.max_cluster_size
  tolerances:
    coefficients.n_clusters: 0
    coefficients.min_cluster_size: 0
    coefficients.max_cluster_size: 0

output_format: csv

hayashi_script: cases/hclust_simulated/hayashi/run.hay
reference_scripts:
  Python: cases/hclust_simulated/reference/run.py

notes: Three well-separated 2D blobs. Ward linkage with cut=3.0 and cophenetic correlation.

result:
  summary: ""
  known_differences: []
  issues_opened: []
