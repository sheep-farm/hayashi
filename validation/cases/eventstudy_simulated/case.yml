id: eventstudy_simulated
title: Event study with grouped standard errors on simulated data
estimator_family: eventstudy
status: active
dimension: numerical

dataset:
  name: simulated
  source: generated by data/gen.py
  licence: n/a

references:
  - R
  - Python

comparison:
  quantities:
    - coefficients
    - standard_errors
  tolerances:
    coefficients: 0.05
    standard_errors: 0.05

output_format: csv

hayashi_script: cases/eventstudy_simulated/hayashi/run.hay
reference_scripts:
  R: cases/eventstudy_simulated/reference/run.R
  Python: cases/eventstudy_simulated/reference/run.py

notes: |
  Simulated panel with 60 units and 5 time periods. Half the units are treated
  at time 2 and the other half are never treated. The outcome has a calendar
  trend and a post-treatment effect. Standard errors are clustered by unit and
  compared with R (sandwich::vcovCL) and Python (statsmodels OLS with
  cov_type='cluster').

result:
  summary: "Hayashi eventstudy coefficients and cluster-robust standard errors compared against R and Python."
  known_differences:
    - Cluster-robust standard-error finite-sample corrections differ slightly between implementations.
  issues_opened: []
