id: tvp_simulated
title: Time-varying parameter regression on simulated data
estimator_family: tvp
status: active
dimension: numerical

dataset:
  name: simulated
  source: generated by data/gen.py
  licence: n/a

references:
  - R
  - Python

comparison:
  quantities:
    - coefficients
  tolerances:
    coefficients: 0.5

output_format: csv

hayashi_script: cases/tvp_simulated/hayashi/run.hay
reference_scripts:
  R: cases/tvp_simulated/reference/run.R
  Python: cases/tvp_simulated/reference/run.py

notes: Simulated TVP data with smooth intercept and slope drift. The reference is the true final coefficient vector because Greeners TVP uses a simple Kalman-grid implementation with no readily available reference implementation.

result:
  summary: "Hayashi TVP final smoothed coefficients are compared against the true final DGP values."
  known_differences:
    - TVP smoothing can lag sharp drift; a generous coefficient tolerance is used.
  issues_opened: []
