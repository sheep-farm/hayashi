  source: generated by data/gen.py
  licence: n/a

references:
  - R
  - Python

comparison:
  quantities:
    - coefficients
    - standard_errors
  tolerances:
    coefficients: 1e-8
    standard_errors: 1e-8

output_format: csv

hayashi_script: cases/nardl_simulated/hayashi/run.hay
reference_scripts:
