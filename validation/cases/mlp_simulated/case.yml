id: mlp_simulated
title: Multilayer Perceptron on simulated data
estimator_family: mlp
status: active
dimension: numerical

dataset:
  name: simulated
  source: generated by data/gen.py
  licence: n/a

references:
  - Python

comparison:
  quantities:
    - coefficients
  tolerances:
    coefficients: 0.05

output_format: csv

hayashi_script: cases/mlp_simulated/hayashi/run.hay
reference_scripts:
  Python: cases/mlp_simulated/reference/run.py

notes: Simulated linear-ish y from x1 and x2 with small noise. Compare R-squared against scikit-learn MLPRegressor (logistic activation, adam solver). Only Python reference because R lacks an equivalent stable MLP package for this use.

result:
  summary: "Hayashi MLP with Adam matches scikit-learn R-squared within tolerance."
  known_differences:
    - Different weight initialisation and random seed across implementations.
  issues_opened: []
