id: xtpoisson_simulated
title: Panel Poisson via GEE on simulated data
estimator_family: xtpoisson
status: active
dimension: numerical

dataset:
  name: simulated
  source: generated by data/gen.py
  licence: n/a

references:
  - R
  - Python

comparison:
  quantities:
    - coefficients
    - standard_errors
  tolerances:
    coefficients: 1e-3
    standard_errors: 1e-3

output_format: csv

hayashi_script: cases/xtpoisson_simulated/hayashi/run.hay
reference_scripts:
  R: cases/xtpoisson_simulated/reference/run.R
  Python: cases/xtpoisson_simulated/reference/run.py

notes: Simulated panel with N=50 groups and T=4 periods. GEE Poisson with exchangeable working correlation; coefficients and sandwich standard errors compared.

result:
  summary: "Hayashi GEE Poisson coefficients and standard errors match R and Python references."
  known_differences: []
  issues_opened: []
