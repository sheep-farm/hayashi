id: pstr_simulated
title: Panel Smooth Transition Regression on simulated data
estimator_family: pstr
status: pass
dimension: numerical

dataset:
  name: simulated
  source: generated by data/gen.py
  licence: n/a

references:
  - R
  - Python

comparison:
  quantities:
    - coefficients
    - standard_errors
  tolerances:
    coefficients: 1e-1
    standard_errors: 1e-2

output_format: csv

hayashi_script: cases/pstr_simulated/hayashi/run.hay
reference_scripts:
  R: cases/pstr_simulated/reference/run.R
  Python: cases/pstr_simulated/reference/run.py

notes: Simulated panel with N=50, T=10. y = beta0*x + beta1*x*g(q; gamma=5, c=0.5) + FE + noise. Gamma, c, beta0_x and beta1_x compared against grid-search references.

result:
  summary: "Hayashi PSTR gamma, threshold and coefficients match R and Python grid-search references."
  known_differences:
    - Gamma and c are grid-search estimates; exact MLE refinement is not performed by the reference.
  issues_opened: []
