id: panel_fe_twoway_cluster_wagepan
title: Availability of raw two-way fixed-effects covariance inference on wagepan
estimator_family: panel_fe
status: pass
dimension: availability

dataset:
  name: wooldridge::wagepan
  source: Shared wagepan CSV produced by data/gen.py; both R and Python references read the same CSV
  licence: public teaching dataset

references:
  - R
  - Python

comparison:
  quantities:
    - availability.covariance_rejected
  tolerances:
    availability.covariance_rejected: 0

reference_evidence:
  R:
    availability.covariance_rejected:
      class: exact
      rationale: Exact numeric rejection indicator after finite full-rank controls and material raw d81/eigenvalue rejection checks; no estimator or uncertainty accuracy claim.
  Python:
    availability.covariance_rejected:
      class: exact
      rationale: Exact numeric rejection indicator after finite full-rank controls and material raw d81/eigenvalue rejection checks; no estimator or uncertainty accuracy claim.

output_format: json

hayashi_script: cases/panel_fe_twoway_cluster_wagepan/hayashi/run.hay
reference_scripts:
  R: cases/panel_fe_twoway_cluster_wagepan/reference/run.R
  Python: cases/panel_fe_twoway_cluster_wagepan/reference/run.py

notes: >-
  Explicit availability contract for the retained raw materially indefinite covariance.
  Ordinary FE must succeed outside the catch; only specific covariance rejection
  can produce the exact numeric indicator 1. Both references assert finite raw
  covariance with material negative d81 variance and eigenvalues. Unexpected
  inference success or unrelated errors fail. No coefficient/SE qualification,
  clipping, PSD projection or blanket allow-blocked policy is implied.

result:
  summary: Exact availability contract passes against R and Python; raw covariance inference remains unavailable.
  known_differences: []
  issues_opened: []
