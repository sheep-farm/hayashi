id: causalforest_simulated
title: Causal Forest for conditional ATE on simulated data
estimator_family: causalforest
status: pass
dimension: numerical

dataset:
  name: simulated
  source: generated by data/gen.py
  licence: n/a

references:
  - R
  - Python

comparison:
  quantities:
    - coefficients.ate
  tolerances:
    coefficients.ate: 0.12

output_format: csv

hayashi_script: cases/causalforest_simulated/hayashi/run.hay
reference_scripts:
  R: cases/causalforest_simulated/reference/run.R
  Python: cases/causalforest_simulated/reference/run.py

notes: Simulated data y = 1 + 2*x1 - x2 + 0.5*treated + N(0,1). Hayashi causalforest() reports the average treatment effect. R reference uses grf::causal_forest; Python uses econml.grf.CausalForest.

result:
  summary: ""
  known_differences:
    - Python CausalForest defaults to honest sub-sampling and max_samples=0.45, which can shift the ATE slightly from the R grf implementation.
  issues_opened: []
