id: panel_qreg_simulated
title: Panel quantile regression on simulated fixed-effects data
estimator_family: panel_qreg
status: active
dimension: numerical

dataset:
  name: simulated
  source: generated by data/gen.py
  licence: n/a

references:
  - R
  - Python

comparison:
  quantities:
    - coefficients
    - standard_errors
  tolerances:
    coefficients: 1e-6
    standard_errors: 1.0

output_format: csv

hayashi_script: cases/panel_qreg_simulated/hayashi/run.hay
reference_scripts:
  R: cases/panel_qreg_simulated/reference/run.R
  Python: cases/panel_qreg_simulated/reference/run.py

notes: Simulated panel with entity fixed effects and heteroskedastic errors. References demean the data and run quantile regression without an intercept; standard errors are convention-sensitive.

result:
  summary: "Hayashi panel quantile regression matches R and Python references."
  known_differences:
    - Standard errors for quantile regression are computed by different methods across implementations.
  issues_opened: []
