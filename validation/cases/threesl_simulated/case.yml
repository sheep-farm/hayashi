id: threesl_simulated
title: Three-stage least squares on a simple simultaneous system
estimator_family: three_sls
status: active
dimension: numerical

dataset:
  name: simulated
  source: generated by data/gen.py
  licence: n/a

references:
  - R
  - Python

comparison:
  quantities:
    - coefficients
    - standard_errors
  tolerances:
    coefficients: 1e-4
    standard_errors: 1e-3

output_format: csv

hayashi_script: cases/threesl_simulated/hayashi/run.hay
reference_scripts:
  R: cases/threesl_simulated/reference/run.R
  Python: cases/threesl_simulated/reference/run.py

notes: Simultaneous two-equation system with correlated errors. Each equation includes an
  intercept, one exogenous and one endogenous regressor; the excluded exogenous from the
  other equation is used as an instrument. Python reference is linearmodels.system.IV3SLS
  with an explicit constant column.

result:
  summary: "Hayashi 3SLS matches the linearmodels and systemfit references."
  known_differences:
    - R systemfit standard errors differ in the third decimal from the Python linearmodels reference.
  issues_opened: []
