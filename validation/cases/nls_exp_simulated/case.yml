id: nls_exp_simulated
title: Nonlinear least squares exponential model on simulated data
estimator_family: nls
status: active
dimension: numerical

dataset:
  name: simulated
  source: generated by data/gen.py
  licence: n/a

references:
  - R
  - Python

comparison:
  quantities:
    - coefficients
    - standard_errors
  tolerances:
    coefficients: 1e-6
    standard_errors: 1e-8

output_format: csv

hayashi_script: cases/nls_exp_simulated/hayashi/run.hay
reference_scripts:
  R: cases/nls_exp_simulated/reference/run.R
  Python: cases/nls_exp_simulated/reference/run.py

notes: Simulated data from y = a * exp(b * x) + N(0, 0.1). Coefficients and
  standard errors compared against R `nls` and Python `scipy.optimize.curve_fit`.

result:
  summary: "Hayashi NLS exp matches R and Python references."
  known_differences:
    - R nls converges to slightly different coefficients at the 1e-8 level; coefficient tolerance relaxed to 1e-6.
  issues_opened: []
