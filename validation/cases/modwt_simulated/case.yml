id: modwt_simulated
title: MODWT (Haar) on simulated time series
estimator_family: modwt
status: active
dimension: numerical

dataset:
  name: simulated
  source: generated by data/gen.py
  licence: n/a

references:
  - Python

comparison:
  quantities:
    - W_1
    - W_2
    - W_3
  tolerances:
    W_1: 1e-12
    W_2: 1e-12
    W_3: 1e-12

output_format: keyvalue

hayashi_script: cases/modwt_simulated/hayashi/run.hay
reference_scripts:
  Python: cases/modwt_simulated/reference/run.py

notes: >-
  Simulated series (trend + 16-period sine + noise). Greeners MODWT uses
  unnormalised Haar filters, equivalent to `pywt.swt(..., norm=False)`.
  `pywt` returns coefficients coarse-to-fine; the reference reverses them
  to match Greeners' W_1 (finest) convention.

result:
  summary: "MODWT wavelet energies match pywt.swt with norm=False."
  known_differences:
    - Approximation energy V_3 not compared due to different conventions.
  issues_opened: []
