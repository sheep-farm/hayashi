id: modwt_simulated
title: MODWT (Haar) on simulated time series
estimator_family: modwt
status: pass
dimension: numerical

dataset:
  name: simulated
  source: generated by data/gen.py
  licence: n/a

references:
  - R
  - Python

comparison:
  quantities:
    - coefficients
  tolerances:
    coefficients: 1e-12

output_format: csv

hayashi_script: cases/modwt_simulated/hayashi/run.hay
reference_scripts:
  R: cases/modwt_simulated/reference/run.R
  Python: cases/modwt_simulated/reference/run.py

notes: Simulated series (trend + 16-period sine + noise). Greeners MODWT uses unnormalised Haar filters, equivalent to pywt.swt(..., norm=False). Only wavelet energy summaries are compared; standard errors are undefined and excluded from qualification.

result:
  summary: "MODWT wavelet energies match pywt.swt with norm=False."
  known_differences:
    - Approximation energy V_3 not compared due to different conventions.
    - Standard errors are not defined for wavelet energy totals.
  issues_opened: []
