id: qrf_inf_simulated
title: Quantile Regression Forest inference at tau=0.75 on simulated heteroskedastic data
estimator_family: qrf_inf
status: active
dimension: numerical

dataset:
  name: simulated
  source: generated by data/gen.py
  licence: n/a

references:
  - R
  - Python

comparison:
  quantities:
    - coefficients.r_squared
  tolerances:
    coefficients.r_squared: 0.05

output_format: csv

hayashi_script: cases/qrf_inf_simulated/hayashi/run.hay
reference_scripts:
  R: cases/qrf_inf_simulated/reference/run.R
  Python: cases/qrf_inf_simulated/reference/run.py

notes: Simulated heteroskedastic data y = 3*x1 + N(0, 0.1*(1+0.5*x1)), with x2 irrelevant. qrf_inf() at q=0.75 with 50 trees, depth 5, 50 bootstrap samples. OOB R^2 compared against grf::quantile_forest and quantile_forest.RandomForestQuantileRegressor.

result:
  summary: ""
  known_differences:
    - R grf and Python quantile_forest use different node-sampling and quantile-weighting rules, leading to small R^2 differences.
  issues_opened: []
