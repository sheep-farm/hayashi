id: orf_simulated
title: Orthogonal Random Forest (ORF) ATE on simulated data
estimator_family: orf
status: pass
dimension: numerical

dataset:
  name: simulated
  source: generated by data/gen.py
  licence: n/a

references:
  - R
  - Python

comparison:
  quantities:
    - coefficients.ate
  tolerances:
    coefficients.ate: 0.9

output_format: csv

hayashi_script: cases/orf_simulated/hayashi/run.hay
reference_scripts:
  R: cases/orf_simulated/reference/run.R
  Python: cases/orf_simulated/reference/run.py

notes: Simulated data y = 1 + 2*x1 - x2 + 0.5*treated + 0.3*w1 - 0.2*w2 + N(0,1). Hayashi orf() reports the average treatment effect. R reference uses grf::causal_forest on the full set of covariates; Python uses econml.orf.DROrthoForest.

result:
  summary: ""
  known_differences:
    - ORF implementations can vary substantially, so a wide tolerance is used for the ATE.
    - R reference does not have an ORF implementation, so grf::causal_forest is used as a proxy.
  issues_opened: []
