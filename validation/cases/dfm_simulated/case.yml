id: dfm_simulated
title: Dynamic factor model on simulated data
estimator_family: dfm
status: pass
dimension: numerical

dataset:
  name: simulated
  source: generated by data/gen.py
  licence: n/a

references:
  - R
  - Python

comparison:
  quantities:
    - coefficients
  tolerances:
    coefficients: 0.20

output_format: csv

hayashi_script: cases/dfm_simulated/hayashi/run.hay
reference_scripts:
  R: cases/dfm_simulated/reference/run.R
  Python: cases/dfm_simulated/reference/run.py

notes: Simulated four observed series driven by two common factors. All variables are standardised in data/gen.py, so the quantities compared are communalities (1 minus observation-noise/uniqueness variance). This is invariant to the arbitrary sign/rotation of the estimated factors. Standard errors are not available in the tidy output and are therefore set to NaN on both sides.

result:
  summary: "Hayashi DFM communality compared against R factanal and Python statsmodels DynamicFactor."
  known_differences:
    - R factanal and statsmodels DynamicFactor use different estimation algorithms (static factor vs. state-space EM), so communalities can differ slightly.
  issues_opened: []
