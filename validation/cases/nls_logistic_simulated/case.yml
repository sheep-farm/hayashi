id: nls_logistic_simulated
title: Nonlinear least squares logistic model on simulated data
estimator_family: nls
status: active
dimension: numerical

dataset:
  name: simulated
  source: generated by data/gen.py
  licence: n/a

references:
  - R
  - Python

comparison:
  quantities:
    - coefficients
    - standard_errors
  tolerances:
    coefficients: 1e-3
    standard_errors: 1e-2

output_format: txt

hayashi_script: cases/nls_logistic_simulated/hayashi/run.hay
reference_scripts:
  R: cases/nls_logistic_simulated/reference/run.R
  Python: cases/nls_logistic_simulated/reference/run.py

notes: Simulated data from y = a / (1 + exp(-b*(x-c))) + N(0, 0.2).
  Coefficients and standard errors compared against R `nls` and Python
  `scipy.optimize.curve_fit`.

result:
  summary: "Hayashi NLS logistic matches R and Python references."
  known_differences: []
  issues_opened: []
