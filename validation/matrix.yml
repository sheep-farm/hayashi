  dimension: numerical
  status: pass
- id: logit_mroz
  notes: Logit labour-force participation on the Mroz dataset.
  dimension: numerical
  status: pass
- id: lowess_simulated
  notes: Simulated y = sin(x) + N(0, 0.2). Compare LOWESS fitted values at mean, first,
    middle and last observations.
  dimension: numerical
  status: pass
- id: lpdid_pylpdid_quickstart
  notes: Uses the same absorbing staggered-adoption DGP as pylpdid's quickstart example.
    The constant treatment effect is 2.0, so post-treatment coefficients should be
    close to 2.0. Only the Python reference is provided (R is left aside for now).
  dimension: numerical
  status: pass
- id: lroc_simulated
  notes: Simulated strong predictor logit. AUC and Gini exported as a coefficient
    table.
  dimension: numerical
  status: pass
- id: lstm_simulated
  notes: PyTorch/TensorFlow stochastic training is not reproducible enough for numerical
    validation.
  dimension: numerical
  status: not-supported
- id: ma_book
  notes: Uses the same simulated MA(1) DGP as Chapter 26 of the book.
  dimension: numerical
  status: pass
- id: manova_simulated
  notes: Simulated three groups with distinct bivariate means. Compare Pillai, Wilks,
