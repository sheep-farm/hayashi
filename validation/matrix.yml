cases:
- id: ab_grunfeld
  notes: Arellano-Bond difference GMM for dynamic panel investment demand.
  dimension: numerical
  status: pass
- id: anova_wooldridge_wage1
  notes: One-way ANOVA of wage across education groups.
  dimension: numerical
  status: pass
- id: ar_book
  notes: Uses the same simulated AR(1) DGP as Chapter 26 of the book.
  dimension: numerical
  status: pass
- id: ardl_gdp
  notes: ARDL(1,1) model of US real GDP on consumption.
  dimension: numerical
  status: pass
- id: arima_book
  notes: ARIMA(1,1,0) on a simulated random walk with seed 42. The intercept reported
    by Hayashi is excluded from comparison because the R/Python references are estimated
    without trend.
  dimension: numerical
  status: pass
- id: arima_gdp
  notes: R and Python exact-likelihood references agree after correcting two R one-based
    indexing errors; current Hayashi estimates match both within tolerance.
  dimension: numerical
  status: pass
- id: arma_book
  notes: Uses the same simulated ARMA(1,1) DGP as Chapter 26 of the book. Reference
    replicates Hayashi's default Hannan-Rissanen two-step estimator.
  dimension: numerical
  status: pass
- id: autoreg_gdp
  notes: The R and Python references use the same conditional AR(1) design with a
    constant and linear trend; current Hayashi estimates match both within tolerance.
  dimension: numerical
  status: pass
- id: bart_simulated
  notes: Simulated data y = 3*x1 + N(0, 0.1), x2 irrelevant. BART with 20 trees, depth
    3, 500 post-burn draws and 200 burn-in. Reference is a scikit-learn GradientBoostingRegressor
    approximation because a full BART posterior is too heavy for the venv.
  dimension: numerical
  status: pass
- id: bayes_lm_simulated
  notes: Simulated y = 1 + 2x1 - 1.5x2 + noise. Compares posterior means of x1 and
    x2 from Hayashi's conjugate bayes_lm against OLS (which the diffuse prior should
    recover).
  dimension: numerical
  status: pass
- id: bayes_sfa_production_simulated
  notes: No stable R/Python reference with half-normal inefficiency MCMC available;
    PyMC implementation too heavy and fragile for the validation venv.
  dimension: numerical
  status: not-supported
- id: be_simulated
  notes: Panel with N=50 entities and T=4 periods. The between estimator collapses
    each entity to its temporal means and runs OLS on the collapsed data.
  dimension: numerical
  status: pass
- id: betareg_wooldridge_401k
  notes: Beta regression on 401k participation rates. Greeners now estimates the model
    by BFGS with an analytic gradient and computes standard errors from the observed
    inverse Hessian, matching R betareg.
  dimension: numerical
  status: pass
- id: biplot_simulated
  notes: Symmetric PCA biplot. Compare explained-variance ratios and sign-robust squared
    loading sums.
  dimension: numerical
  status: pass
- id: bootstrap_ols_simulated
  notes: Simulated OLS data (y = 1 + 2x + noise). Hayashi bootstrap(ols, ...) is compared
    with R boot::boot and a Python statsmodels OLS pairs bootstrap; quantities are
    the mean and standard deviation of the bootstrap slope and intercept distributions.
  dimension: numerical
  status: pass
- id: bsc_simulated
  notes: No stable R CausalImpact/python pycausalimpact reference in the venv; Bayesian
    synthetic-control weights depend on prior tuning.
  dimension: numerical
  status: not-supported
- id: bvar_simulated
  notes: R mfbvar/bvar packages fail to install; PyMC implementation is too heavy
    for a deterministic CI reference.
  dimension: numerical
  status: not-supported
- id: causal_impact_simulated
  notes: Bayesian structural time series for counterfactual inference (Brodersen 2015).
    Uses simulated data with known treatment effect.
  dimension: numerical
  status: pass
- id: causalforest_simulated
  notes: Simulated data y = 1 + 2*x1 - x2 + 0.5*treated + N(0,1). Hayashi causalforest()
    reports the average treatment effect. R reference uses grf::causal_forest; Python
    uses econml.grf.CausalForest.
  dimension: numerical
  status: pass
- id: centile_wooldridge_wage1
  notes: Centiles 10, 25, 50, 75, 90 for the wage variable.
  dimension: numerical
  status: pass
- id: ci_wooldridge_wage1
  notes: 95% confidence interval for the wage mean.
  dimension: numerical
  status: pass
- id: clogit_simulated
  notes: Simulated matched groups with group fixed effects and a single endogenous
    regressor. R reference is survival::clogit; groups without within-group variation
    are dropped at generation time.
  dimension: numerical
  status: pass
- id: cloglog_wooldridge_affairs
  notes: Complementary log-log GLM on Wooldridge affairs. A sign error in the Greeners
    cloglog derivative caused IRLS divergence; the derivative is now positive and
    the model converges to the same estimates as R glm and statsmodels.
  dimension: numerical
  status: pass
- id: codebook_wooldridge_wage1
  notes: Codebook summary for the continuous wage variable.
  dimension: numerical
  status: pass
- id: coint_book
  notes: VECM(1) on a simulated cointegrated system where y = 2*x + e2 and x = cumsum(e1).
    The cointegration (beta) and adjustment (alpha) coefficients and standard errors
    are compared. Beta SEs are approximate Engle-Granger/OLS proxies; alpha SEs are
    OLS conditional SEs given the estimated beta. The 5e-1 tolerance accommodates
    the bootstrap SEs produced by Hayashi.
  dimension: numerical
  status: pass
- id: condnum_simulated
  notes: Condition number of the OLS regressor matrix on simulated data.
  dimension: numerical
  status: pass
- id: conformal_simulated
  notes: Simulated linear DGP y = 1 + 2x1 - 1.5x2 + noise. Compares split-conformal
    empirical coverage and conformal quantile.
  dimension: numerical
  status: pass
- id: copula_simulated
  notes: Simulated bivariate normal with Pearson correlation 0.6. Dependence measures
    exported as a coefficient table; standard errors are not defined for copula summary
    statistics.
  dimension: numerical
  status: pass
- id: correlate_wooldridge_wage1
  notes: Pairwise correlations of wage, educ, exper, tenure.
  dimension: numerical
  status: pass
- id: cox_heart
  notes: Cox proportional hazards regression for survival time after heart transplant.
  dimension: numerical
  status: pass
- id: cpoisson_simulated
  notes: Simulated panel counts with group fixed effects; the reference implements
    the exact conditional Poisson likelihood (multinomial fixed-total) using analytic
    gradient and Hessian.
  dimension: numerical
  status: pass
- id: cuped_simulated
  notes: Simulated A/B test with pre-experiment covariate. Compare CUPED-adjusted
    ATE.
  dimension: numerical
  status: pass
- id: dbscan_simulated
  notes: Three dense 2D blobs plus five isolated noise points. Compare cluster and
    noise counts.
  dimension: numerical
  status: pass
- id: dcc_garch_nyse
  notes: DCC-GARCH (Dynamic Conditional Correlation GARCH) on NYSE returns. Uses simplified
    DCC-GARCH(1,1) model.
  dimension: numerical
  status: pass
- id: dfm_simulated
  notes: Simulated four observed series driven by two common factors. All variables
    are standardised in data/gen.py, so the quantities compared are communalities
    (1 minus observation-noise/uniqueness variance). This is invariant to the arbitrary
    sign/rotation of the estimated factors. Standard errors are not available in the
    tidy output and are therefore set to NaN on both sides.
  dimension: numerical
  status: pass
- id: did_kielmc
  notes: Difference-in-differences effect of incinerator proximity on log house prices.
  dimension: numerical
  status: pass
- id: did_simulated
  notes: Simulated 2x2 DiD with ATT=1.5. Coefficients and heteroskedasticity-consistent
    (HC0) standard errors are compared against base-R/sandwich and statsmodels.
  dimension: numerical
  status: pass
- id: dml_crossfit_simulated
  notes: Simulated partially linear causal model y = 1.5*d + g(x) + eps with binary
    d confounded by x. Compares the DML cross-fitted ATE.
  dimension: numerical
  status: pass
- id: double_ml_simulated
  notes: Double Machine Learning (Chernozhukov et al. 2018) for heterogeneous treatment
    effects. Uses simulated data with known treatment effect.
  dimension: numerical
  status: pass
- id: doublesort_simulated
  notes: Simulated return data with size and book-to-market. Compares the mean return
    of the small-size / high-BM (low size, high bm) portfolio from a 5x5 double sort.
  dimension: numerical
  status: pass
- id: dr_learner_simulated
  notes: Simulated data with a single confounder x, binary treatment d, and constant
    ATE=2.0. DR-Learner average treatment effect compared against a manual AIPW reference.
  dimension: numerical
  status: pass
- id: dw_simulated
  notes: Durbin-Watson test for first-order autocorrelation on simulated OLS residuals.
  dimension: numerical
  status: pass
- id: egarch_nyse
  notes: EGARCH(1,1) on NYSE returns.
  dimension: numerical
  status: pass
- id: elasticnet_hprice1
  notes: Elastic Net regression of log house price on log lot size, log square footage,
    bedrooms and colonial dummy.
  dimension: numerical
  status: pass
- id: estat_classification_simulated
  notes: Simulated logit. Sensitivity, specificity and correct rate at threshold 0.5.
  dimension: numerical
  status: pass
- id: estat_endog_simulated
  notes: Simulated endogenous regressor with one instrument. Wu-Hausman F and p-value.
  dimension: numerical
  status: pass
- id: estat_gof_simulated
  notes: Simulated strong predictor logit. Hosmer-Lemeshow chi-square by deciles.
  dimension: numerical
  status: pass
- id: estat_overid_simulated
  notes: Simulated IV with two instruments and one endogenous regressor. Sargan J-statistic
    and p-value.
  dimension: numerical
  status: pass
- id: ets_gdp
  notes: 'Simple exponential smoothing (ETS(A,N,N)) on US real GDP.  Hayashi uses
    `ses(df, gdp)`,

    and the R/Python references use SES with SSE grid search / statsmodels optimisation.

    Only the smoothing parameter alpha is compared because the Hayashi text output
    does

    not expose the initial level.'
  dimension: numerical
  status: pass
- id: eventstudy_simulated
  notes: 'Simulated panel with 60 units and 5 time periods. Half the units are treated

    at time 2 and the other half are never treated. The outcome has a calendar

    trend and a post-treatment effect. Standard errors are clustered by unit and

    compared with R (sandwich::vcovCL) and Python (statsmodels OLS with

    cov_type=''cluster'').'
  dimension: numerical
  status: pass
- id: factor_simulated
  notes: Simulated four variables from two factors. Compares the first two eigenvalues
    of the correlation matrix (invariant to sign/rotation of loadings).
  dimension: numerical
  status: pass
- id: fapanel_simulated
  notes: Requires plm + factor combination; no single canonical reference implementation.
  dimension: numerical
  status: not-supported
- id: favar_simulated
  notes: Simulated three observable series driven by one common factor plus the observed
    y1. Python reference extracts the first PCA factor and estimates a VAR(1) by OLS,
    matching the FAVAR two-step approach.
  dimension: numerical
  status: pass
- id: fcoef_simulated
  notes: No standard R/Python package for the same functional-coefficient estimator.
  dimension: numerical
  status: not-supported
- id: feiv_simulated
  notes: Panel with N=200 entities and T=5 periods; x is endogenous and instrumented
    by z. Independent R and Python within-2SLS references use the Greeners residual
    degrees-of-freedom convention n - k - (G - 1).
  dimension: numerical
  status: pass
- id: fmb_simulated
  notes: Classic Fama-MacBeth regression on a deterministic simulated asset panel.
  dimension: numerical
  status: pass
- id: fmols_simulated
  notes: R cointReg/urca packages not available; cointegration Fully-Modified OLS
    not in base R or statsmodels.
  dimension: numerical
  status: not-supported
- id: ftest_robust_wooldridge_wage1
  notes: Robust F-test (Wooldridge 2010) with cluster-robust covariance for joint
    significance test.
  dimension: numerical
  status: pass
- id: fuzzy_rd_simulated
  notes: Fuzzy RD with 70% compliance at the cutoff. Compare local average treatment
    effect (LATE).
  dimension: numerical
  status: pass
- id: garch_book
  notes: Uses the same simulated GARCH(1,1) DGP as Chapter 30 of the book. Coefficients
    only because GARCH standard-error approximations differ widely between implementations.
  dimension: numerical
  status: pass
- id: garch_nyse
  notes: GARCH(1,1) on NYSE returns.
  dimension: numerical
  status: pass
- id: gbm_simulated
  notes: Simulated data y = 3*x1 + N(0, 0.1), x2 irrelevant. Gradient Boosting with
    50 trees, learning rate 0.1, max depth 3. MSE and R^2 compared against scikit-learn.
  dimension: numerical
  status: pass
- id: gee_wooldridge_wagepan_ch14
  notes: Wooldridge Introductory Econometrics Chapter 14, Example 14.4 generalized
    estimating equations wage equation.
  dimension: numerical
  status: pass
- id: glm_wooldridge_fertil2_poisson
  notes: Wooldridge dataset fertil2 Poisson GLM for number of children.
  dimension: numerical
  status: pass
- id: glsar_hprice1
  notes: R, Python, and Hayashi use the same iterative GLSAR(1) procedure and agree
    on coefficients and standard errors within tolerance.
  dimension: numerical
  status: pass
- id: gmm_card
  notes: R and Python use robust two-step GMM references with matching covariance
    conventions; current Hayashi estimates match both within tolerance.
  dimension: numerical
  status: pass
- id: gmm_clust_simulated
  notes: Two Gaussian clusters. Compare sorted component means.
  dimension: numerical
  status: pass
- id: gmm_overidentified_simulated
  notes: The DGP has one endogenous regressor and two excluded, valid instruments,
    so L-K=1. R gmm and Python linearmodels use two-step heteroskedastic GMM. The
    maximum standard-error difference is 2.569e-6; 1e-5 accepts the asymptotically
    equivalent finite-sample covariance forms. Coefficients and the Hansen J statistic
    agree to numerical precision.
  dimension: numerical
  status: pass
- id: gp_simulated
  notes: Simulated 1-D regression with a fixed seed; compares training-set R2 and
    MSE between Hayashi, R kernlab and Python sklearn. Tolerances reflect different
    hyperparameter-optimisation conventions.
  dimension: numerical
  status: pass
- id: granger_simulated
  notes: Granger causality test on simulated AR(1) series.
  dimension: numerical
  status: pass
- id: grf_simulated
  notes: Simulated data y = 1 + 2*x1 - x2 + 0.5*treated + N(0,1). Hayashi grf() reports
    the average treatment effect. R reference uses grf::causal_forest to match the
    ATE quantity; Python uses econml.grf.CausalForest.
  dimension: numerical
  status: pass
- id: harveycollier_simulated
  notes: Harvey-Collier recursive t test on simulated OLS residuals.
  dimension: numerical
  status: pass
- id: hausman_robust_wooldridge_wagepan
  notes: Robust Hausman test (Cameron-Trivedi 2005, Wooldridge 2010) with cluster-robust
    covariance.
  dimension: numerical
  status: pass
- id: hawkes_simulated
  notes: Simulated self-exciting Hawkes process. Python reference fits the same MLE
    via L-BFGS-B.
  dimension: numerical
  status: pass
- id: hclust_simulated
  notes: Three well-separated 2D blobs. Ward linkage with cut=3.0 and cophenetic correlation.
  dimension: numerical
  status: pass
- id: heckman_mroz
  notes: Two-step Heckman (Heckit) on the Mroz dataset. SEs are approximate because
    the reference implementations are two-step.
  dimension: numerical
  status: pass
- id: influence_simulated
  notes: Simulated OLS with an outlier. Hayashi exposes DFFITS; reference uses the
    maximum absolute DFFITS value (Cook's D not exported).
  dimension: numerical
  status: pass
- id: isotonic_simulated
  notes: Simulated three-step data. PAVA fitted values at x=1,50,100 compared.
  dimension: numerical
  status: pass
- id: iv_card
  notes: IV with education endogenous and nearc4 as instrument.
  dimension: numerical
  status: pass
- id: iv_cluster_card
  notes: IV returns-to-schooling equation with one-way clustered standard errors by
    Census region.
  dimension: numerical
  status: pass
- id: iv_robust_mroz
  notes: IV returns-to-schooling equation with HC1 heteroskedasticity-robust standard
    errors.
  dimension: numerical
  status: pass
- id: iv_wooldridge_mroz_ch15
  notes: Wooldridge Introductory Econometrics Chapter 15, Example 15.1 returns to
    schooling IV equation for married women.
  dimension: numerical
  status: pass
- id: jb_simulated
  notes: Jarque-Bera normality test on a simulated random sample.
  dimension: numerical
  status: pass
- id: johansen_break_simulated
  notes: Structural-break Johansen test. Python statsmodels.tsa.vecm coint_johansen
    does not support exogenous break dummies. R urca::ca.jo accepts the dummy but
    uses conventional rather than Hayashi's break-adjusted rank critical values. Neither
    provides a fully comparable reference for the declared rank-and-trace contract.
  dimension: numerical
  status: not-supported
- id: kalman_nyse
  notes: Local-level Kalman filter on NYSE returns. Hayashi now estimates sigma_obs
    and sigma_state by maximum likelihood and returns a printable result object. sigma_state
    is very small and the likelihood is flat in that direction, so the absolute tolerance
    is set to 1e-3.
  dimension: numerical
  status: pass
- id: kde_simulated
  notes: Simulated N(2, 1.5). Compares fixed bandwidth, peak density and peak x of
    a Gaussian KDE.
  dimension: numerical
  status: pass
- id: km_aml
  notes: Kaplan-Meier right-continuous survival probabilities at seven checkpoints
    on survival::aml.
  dimension: numerical
  status: pass
- id: kmeans_simulated
  notes: K-Means clustering (MacQueen 1967) with k-means++ initialization. Uses simulated
    2D data with 3 Gaussian clusters.
  dimension: numerical
  status: pass
- id: lasso_hprice1
  notes: Lasso regression of house price on lot size, square footage and bedrooms.
  dimension: numerical
  status: pass
- id: linktest_simulated
  notes: Simulated logit. Linktest yhat and yhat2 coefficients and standard errors.
  dimension: numerical
  status: pass
- id: ljungbox_simulated
  notes: Ljung-Box autocorrelation test on a simulated AR(1) series.
  dimension: numerical
  status: pass
- id: logit_margins_mroz
  notes: Logit average marginal effects and delta-method standard errors match R/statsmodels
