  dimension: numerical
  status: pass
- id: mfvar_simulated
  notes: R mfbvar package failed to install in the previous session.
  dimension: numerical
  status: not-supported
- id: mice_chained_simulated
  notes: MICE (Multiple Imputation by Chained Equations, van Buuren 2011) with m=5,
    iter=10. Uses simulated data with MCAR missing values.
  dimension: numerical
  status: pass
- id: midas_simulated
  notes: Simulated low-frequency y (T=100) and high-frequency x (T*3). y = 1.0 + 2.0
    * x_midas + noise. Compare alpha, beta and R-squared against R optim and Python
    MIDAS grid+minimize references.
  dimension: numerical
  status: pass
- id: mixed_wooldridge_wagepan_ch14
  notes: Wooldridge Introductory Econometrics Chapter 14, Example 14.4 mixed linear
