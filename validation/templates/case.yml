id: <case-id>
title: <short human-readable title>
estimator_family: <ols|iv|logit|probit|fe|re|did|rd|...>
status: not-started
dimension: numerical

dataset:
  name: <dataset name>
  source: <URL, package name, or DGP from book_pt_BR/codes/XX.hay>
  licence: <licence>
  checksum: <sha256 if file is committed>
  download_script: <optional script to fetch data>

references:
  - R
  - Python
  # - Stata  # uncomment only if Stata is available locally

# Optional reference_evidence: see ../README.md#reference-evidence-classes.
# Absence is unclassified, not exact. After reviewing every reference and
# tolerance key, supply the complete mapping. Example entry (not a full mapping):
# reference_evidence:
#   Python:
#     coefficients:
#       class: convention-matched
#       rationale: Same estimator after the documented intercept alignment.
# Allowed classes: exact, convention-matched, behavioural-proxy.
# Each entry requires class and a non-empty rationale; no defaults or overrides.

comparison:
  quantities:
    - coefficients
    - standard_errors
    - r_squared
    - nobs
  tolerances:
    coefficients: 1e-6
    standard_errors: 1e-6
    r_squared: 1e-8
    nobs: 0

hayashi_script: cases/<case-id>/hayashi/run.hay
reference_scripts:
  R: cases/<case-id>/reference/run.R
  Python: cases/<case-id>/reference/run.py
  Stata: cases/<case-id>/reference/run.do

result:
  summary: ""
  known_differences: []
  issues_opened: []
