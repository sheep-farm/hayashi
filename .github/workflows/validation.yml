name: Validation

on:
  pull_request:
    branches: [dev, master]
    paths:
      - "validation/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/checkout-greeners.sh"
      - ".github/workflows/validation.yml"
  push:
    branches: [dev, master]
    paths:
      - "validation/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/checkout-greeners.sh"
      - ".github/workflows/validation.yml"
  workflow_dispatch:

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Checkout Greeners dependency
        run: bash scripts/checkout-greeners.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install R
        uses: r-lib/actions/setup-r@v2

      - name: Install Python dependencies
        run: |
          pip install --require-hashes -r validation/requirements.txt
          pip install -r validation/requirements-git.txt

      - name: Install R dependencies
        run: |
          Rscript -e 'install.packages("renv", repos="https://cloud.r-project.org")'
          Rscript -e 'renv::restore(lockfile="validation/renv.lock", prompt=FALSE)'

      - name: Record installed environment versions
        run: |
          mkdir -p validation/reports
          {
            echo "Python packages"
            echo "==============="
            python -m pip freeze
            echo ""
            echo "R packages"
            echo "=========="
            Rscript -e 'ip <- as.data.frame(installed.packages()[, c("Package", "Version"), drop = FALSE]); write.table(ip, row.names = FALSE, sep = "\t")'
          } > validation/reports/environment-versions.txt

      - name: Check validation metadata
        run: python validation/run.py --check

      - name: Test validation runner
        run: python -m unittest validation/test_run.py

      - name: Build Hayashi
        run: cargo build --release

      - name: Add Hayashi to PATH
        run: echo "${{ github.workspace }}/target/release" >> "$GITHUB_PATH"

      - name: Run validation programme
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            python validation/run.py
          else
            python validation/run.py --allow-partial
          fi

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: |
            validation/MATRIX.md
            validation/matrix.yml
            validation/reports/environment-versions.txt
            validation/cases/**/hayashi/output.csv
            validation/cases/**/reference/expected.json
