name: Validation

on:
  pull_request:
    branches: [dev, master]
    paths:
      - "validation/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/validation.yml"
  push:
    branches: [dev, master]
    paths:
      - "validation/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/validation.yml"
  workflow_dispatch:

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install R
        uses: r-lib/actions/setup-r@v2

      - name: Install system dependencies for spatial R packages (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libudunits2-dev libgdal-dev libgeos-dev libproj-dev

      - name: Install Python dependencies
        run: |
          pip install --require-hashes -r validation/requirements.txt
          pip install -r validation/requirements-git.txt

      # Source builds of R packages on macOS (e.g. data.table) include
      # <libintl.h>, which the runner image no longer ships. R CMD INSTALL reads
      # compiler flags from ~/.R/Makevars, not from the environment.
      - name: Point R builds at gettext (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install gettext
          prefix="$(brew --prefix gettext)"
          mkdir -p "$HOME/.R"
          {
            echo "CPPFLAGS += -I$prefix/include"
            echo "LDFLAGS += -L$prefix/lib"
          } >> "$HOME/.R/Makevars"

      - name: Install R dependencies
        run: |
          Rscript -e 'install.packages("renv", repos="https://cloud.r-project.org")'
          Rscript -e 'renv::restore(lockfile="validation/renv.lock", prompt=FALSE)'

      - name: Install additional spatial and cointegration R packages
        if: runner.os == 'Linux'
        run: |
          cd validation
          Rscript -e 'renv::install(c("cointReg", "spdep", "spatialreg", "splm"))'

      - name: Install tsDyn from GitHub
        run: |
          Rscript -e 'install.packages("remotes", repos="https://cloud.r-project.org")'
          Rscript -e 'remotes::install_github("MatthieuStigler/tsDyn")'
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

      - name: Record installed environment versions
        run: |
          mkdir -p validation/reports
          {
            echo "Python packages"
            echo "==============="
            python -m pip freeze
            echo ""
            echo "R packages"
            echo "=========="
            Rscript -e 'ip <- as.data.frame(installed.packages()[, c("Package", "Version"), drop = FALSE]); write.table(ip, row.names = FALSE, sep = "\t")'
          } > validation/reports/environment-versions.txt

      - name: Check validation metadata
        run: python validation/run.py --check

      - name: Test validation runner
        run: python -m unittest validation/test_run.py

      - name: Build Hayashi
        run: cargo build --release --features experimental

      - name: Add Hayashi to PATH
        run: echo "${{ github.workspace }}/target/release" >> "$GITHUB_PATH"

      - name: Run validation programme
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            python validation/run.py
          else
            python validation/run.py --allow-partial
          fi

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: validation-report
          path: |
            validation/MATRIX.md
            validation/matrix.yml
            validation/reports/environment-versions.txt
            validation/cases/**/hayashi/output.csv
            validation/cases/**/reference/expected.json
