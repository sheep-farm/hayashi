name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_RELEASE_STRIP: symbols

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Checkout Greeners dependency
        run: git clone --depth 1 --branch develop https://github.com/sheep-farm/Greeners.git ../Greeners
        shell: bash

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build binaries
        run: cargo build --release --bin hay --bin hay-kernel

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          pkg="hay-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "$pkg"
          cp target/release/hay target/release/hay-kernel "$pkg/"
          tar czf "$pkg.tar.gz" "$pkg"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          $pkg = "hay-${{ github.ref_name }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "$pkg" | Out-Null
          Copy-Item target/release/hay.exe -Destination "$pkg/"
          Copy-Item target/release/hay-kernel.exe -Destination "$pkg/"
          Compress-Archive -Path "$pkg/*" -DestinationPath "$pkg.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: hay-${{ matrix.target }}
          path: hay-${{ github.ref_name }}-*

  vscode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build VS Code extension
        run: |
          cd editors/vscode
          npm install
          npm run compile
          npx --yes @vscode/vsce package -o "../../hay-vscode-${{ github.ref_name }}.vsix"

      - uses: actions/upload-artifact@v4
        with:
          name: hay-vscode
          path: hay-vscode-*.vsix

  publish:
    needs: [build, vscode]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: hay-*
          generate_release_notes: true
