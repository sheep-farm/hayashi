[advisories]
# `paste` is currently transitive through greeners/faer/gemm, parquet,
# statrs/nalgebra/simba, and wasmi_core. RUSTSEC lists no safe upgrade.
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "Transitive only; no safe upgrade is currently available." },
    # `instant` is brought in by argmin 0.10 (itself a transitive dep of
    # greeners). Upgrading argmin to 0.11 removes `instant` but reintroduces
    # rand 0.9 duplicates; the dependency is only used for optimization timing.
    { id = "RUSTSEC-2024-0384", reason = "Transitive via greeners/argmin 0.10; timing-only, no safe upgrade without reintroducing rand 0.9 duplicates." },
]
